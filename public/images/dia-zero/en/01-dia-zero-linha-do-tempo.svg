<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Timeline of a zero-day</title><desc id="d">Five stages: the flaw exists, it is discovered, it is exploited with no fix available (zero-day), the fix is published, and attacks continue against anyone who has not updated (n-day).</desc><rect width="1200" height="520" fill="#fcfcfb"/><g font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif">
<text x="60" y="64" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="start">What a zero-day is</text><text x="60" y="102" font-size="21" font-weight="400" fill="#52514e" text-anchor="start">A flaw exploited before a public fix exists: the vendor had zero days to fix it</text>
<line x1="70" y1="230" x2="1130" y2="230" stroke="#dcdbd6" stroke-width="6"/>
<rect x="600" y="214" width="235" height="32" rx="16" fill="#f6c4ae"/>
<text x="717" y="206" font-size="18" font-weight="700" fill="#eb6834" text-anchor="middle">Zero-day window</text>
<circle cx="130" cy="230" r="14" fill="#0b0b0b"/>
<text x="130" y="290" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">The flaw exists</text>
<text x="130" y="322" font-size="18" font-weight="400" fill="#52514e" text-anchor="middle">Nobody knows yet</text>
<circle cx="365" cy="230" r="14" fill="#0b0b0b"/>
<text x="365" y="290" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">Discovery</text>
<text x="365" y="322" font-size="18" font-weight="400" fill="#52514e" text-anchor="middle">By a researcher</text>
<text x="365" y="346" font-size="18" font-weight="400" fill="#52514e" text-anchor="middle">or by an attacker</text>
<circle cx="600" cy="230" r="14" fill="#eb6834"/>
<text x="600" y="290" font-size="23" font-weight="700" fill="#eb6834" text-anchor="middle">Zero-day</text>
<text x="600" y="322" font-size="18" font-weight="400" fill="#52514e" text-anchor="middle">Attacks with no fix</text>
<text x="600" y="346" font-size="18" font-weight="400" fill="#52514e" text-anchor="middle">available</text>
<circle cx="835" cy="230" r="14" fill="#0b0b0b"/>
<text x="835" y="290" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">Fix published</text>
<text x="835" y="322" font-size="18" font-weight="400" fill="#52514e" text-anchor="middle">The advisory goes public</text>
<circle cx="1070" cy="230" r="14" fill="#0b0b0b"/>
<text x="1070" y="290" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="middle">N-day</text>
<text x="1070" y="322" font-size="18" font-weight="400" fill="#52514e" text-anchor="middle">Attacks against those</text>
<text x="1070" y="346" font-size="18" font-weight="400" fill="#52514e" text-anchor="middle">who have not updated</text>
<rect x="60" y="400" width="1080" height="70" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
<text x="84" y="430" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start">The biggest risk:</text>
<text x="262" y="430" font-size="20" font-weight="400" fill="#0b0b0b" text-anchor="start">there is no patch in the orange window. Defense: reduce exposure, monitor, contain.</text>
<text x="84" y="458" font-size="20" font-weight="400" fill="#0b0b0b" text-anchor="start">After the fix, the race is to update before the attacker arrives.</text>
<text x="60" y="505" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Definition: a flaw exploited before a public fix exists (Google Threat Intelligence Group)</text>
</g></svg>