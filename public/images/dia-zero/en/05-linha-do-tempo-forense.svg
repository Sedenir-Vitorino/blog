<text x="84" y="386" font-size="21" font-weight="700" fill="#eb6834" text-anchor="start">Rebuilt timeline (illustrative example)</text>
<text x="84" y="426" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="start">Entry</text>
<text x="250" y="426" font-size="17" font-weight="400" fill="#52514e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">02:13:07 to 02:13:10</text>
<text x="480" y="426" font-size="19" font-weight="400" fill="#0b0b0b" text-anchor="start">unusual request, new process, memory error</text>
