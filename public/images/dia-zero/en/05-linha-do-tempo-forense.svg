<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="t d"><title id="t">Rebuilding an attack timeline</title><desc id="d">Records from three layers, ordered by time, form a timeline with entry, persistence, collection and exit. Illustrative example.</desc><rect width="1200" height="690" fill="#fcfcfb"/><g font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif">
