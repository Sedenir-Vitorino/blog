<text x="814" y="201" font-size="16" font-weight="400" fill="#0b0b0b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">02:13:10 memory error</text>
<rect x="808" y="212" width="324" height="28" rx="4" fill="#f6c4ae"/>
<text x="814" y="233" font-size="16" font-weight="400" fill="#0b0b0b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">02:20:12 bulk query</text>
<text x="814" y="265" font-size="16" font-weight="400" fill="#0b0b0b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">02:31:01 export</text>
<line x1="600" y1="296" x2="600" y2="340" stroke="#eb6834" stroke-width="3"/><polygon points="600,346 593,332 607,332" fill="#eb6834"/>
