<text x="444" y="201" font-size="16" font-weight="400" fill="#0b0b0b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">02:13:08 new process</text>
<rect x="438" y="212" width="324" height="28" rx="4" fill="#f6c4ae"/>
<text x="444" y="233" font-size="16" font-weight="400" fill="#0b0b0b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">02:14:40 account created</text>
<text x="444" y="265" font-size="16" font-weight="400" fill="#0b0b0b" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">02:30:55 files read</text>
