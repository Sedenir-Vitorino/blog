<text x="480" y="498" font-size="19" font-weight="400" fill="#0b0b0b" text-anchor="start">bulk query, export and 2 GB sent out</text>
<text x="60" y="578" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="start">Clocks must be synchronized across systems.</text>
