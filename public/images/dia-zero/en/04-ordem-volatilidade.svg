<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="t d"><title id="t">Order of volatility of digital evidence</title><desc id="d">Six types of evidence, from most to least volatile, per RFC 3227. Collection starts with what disappears first.</desc><rect width="1200" height="580" fill="#fcfcfb"/><g font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif">
<text x="60" y="64" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="start">Collect first what disappears first</text><text x="60" y="102" font-size="21" font-weight="400" fill="#52514e" text-anchor="start">Powering off a machine erases part of the evidence. The order comes from RFC 3227</text>
<text x="60" y="177" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">1. Registers and cache</text>
<rect x="330" y="150" width="90" height="34" rx="5" fill="#eb6834"/>
<text x="434" y="175" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">milliseconds</text>
<text x="60" y="227" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">2. Network and processes</text>
<rect x="330" y="200" width="170" height="34" rx="5" fill="#eb6834"/>
<text x="514" y="225" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">seconds</text>
<text x="60" y="277" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">3. Memory (RAM)</text>
<rect x="330" y="250" width="300" height="34" rx="5" fill="#2a78d6"/>
<text x="644" y="275" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">until power off</text>
<text x="60" y="327" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">4. Swap and temp files</text>
<rect x="330" y="300" width="420" height="34" rx="5" fill="#2a78d6"/>
<text x="764" y="325" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">until reboot</text>
<text x="60" y="377" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">5. Disk</text>
<rect x="330" y="350" width="600" height="34" rx="5" fill="#2a78d6"/>
<text x="944" y="375" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">lasts longer</text>
<text x="60" y="427" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">6. Remote logs</text>
<rect x="330" y="400" width="720" height="34" rx="5" fill="#2a78d6"/>
<text x="1064" y="425" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">lasts longer</text>
<line x1="330" y1="468" x2="1080" y2="468" stroke="#52514e" stroke-width="3"/>
<text x="330" y="494" font-size="18" font-weight="700" fill="#eb6834" text-anchor="start">most volatile</text>
<text x="1080" y="494" font-size="18" font-weight="700" fill="#2a78d6" text-anchor="end">least volatile</text>
<text x="60" y="532" font-size="19" font-weight="400" fill="#0b0b0b" text-anchor="start">Each copy gets a hash (fingerprint) and a chain of custody: who collected it, when, and how it was stored.</text>
<text x="60" y="558" font-size="19" font-weight="400" fill="#0b0b0b" text-anchor="start">Collecting also alters the machine, so ideally run the tools from external media.</text>
</g></svg>