<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Deadlines and records in Brazil</title><desc id="d">Notice to the ANPD within 3 business days, notice to data subjects, connection records kept for 1 year and application access records for 6 months.</desc><rect width="1200" height="600" fill="#fcfcfb"/><g font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif">
<text x="60" y="64" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="start">In Brazil: deadlines and records</text><text x="60" y="102" font-size="21" font-weight="400" fill="#52514e" text-anchor="start">Two rules usually weigh on an investigation: the incident notice and record retention</text>
<rect x="60" y="140" width="530" height="172" rx="8" fill="#ffffff" stroke="#dcdbd6" stroke-width="2"/>
<text x="78" y="174" font-size="20" font-weight="700" fill="#52514e" text-anchor="start">Notice to the ANPD</text>
<text x="78" y="218" font-size="34" font-weight="700" fill="#eb6834" text-anchor="start">3 business days</text>
<text x="78" y="248" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">CD/ANPD Resolution 15/2024: the clock starts when the</text>
<text x="78" y="268" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">incident becomes known. Record when the team found out.</text>
<rect x="610" y="140" width="530" height="172" rx="8" fill="#ffffff" stroke="#dcdbd6" stroke-width="2"/>
<text x="628" y="174" font-size="20" font-weight="700" fill="#52514e" text-anchor="start">Notice to data subjects</text>
<text x="628" y="218" font-size="34" font-weight="700" fill="#eb6834" text-anchor="start">3 business days</text>
<text x="628" y="248" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">Per legal analyses of the resolution, the deadline also runs</text>
<text x="628" y="268" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">from awareness. Small agents get longer deadlines.</text>
<rect x="60" y="330" width="530" height="172" rx="8" fill="#ffffff" stroke="#dcdbd6" stroke-width="2"/>
<text x="78" y="364" font-size="20" font-weight="700" fill="#52514e" text-anchor="start">Connection records</text>
<text x="78" y="408" font-size="34" font-weight="700" fill="#eb6834" text-anchor="start">1 year</text>
<text x="78" y="438" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">Marco Civil, art. 13: the autonomous system administrator</text>
<text x="78" y="458" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">keeps connection records for 1 year.</text>
<rect x="610" y="330" width="530" height="172" rx="8" fill="#ffffff" stroke="#dcdbd6" stroke-width="2"/>
<text x="628" y="364" font-size="20" font-weight="700" fill="#52514e" text-anchor="start">Application access</text>
<text x="628" y="408" font-size="34" font-weight="700" fill="#eb6834" text-anchor="start">6 months</text>
<text x="628" y="438" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">Marco Civil, art. 15: application providers keep them for 6</text>
<text x="628" y="458" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">months. Police or prosecutors may ask for longer, as a</text>
<text x="628" y="478" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">precautionary measure.</text>
<text x="60" y="564" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Informational summary, not legal advice. Check the official text and consult a lawyer</text>
</g></svg>