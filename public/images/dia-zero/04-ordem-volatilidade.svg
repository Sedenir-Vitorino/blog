<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="t d"><title id="t">Ordem de volatilidade da evidência digital</title><desc id="d">Seis tipos de evidência, do mais volátil ao menos volátil, segundo a RFC 3227. A coleta começa pelo que some primeiro.</desc><rect width="1200" height="580" fill="#fcfcfb"/><g font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif">
<text x="60" y="64" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="start">Colete primeiro o que some primeiro</text><text x="60" y="102" font-size="21" font-weight="400" fill="#52514e" text-anchor="start">Ao desligar uma máquina, parte da evidência desaparece. A ordem vem da RFC 3227</text>
<text x="60" y="177" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">1. Registradores e cache</text>
<rect x="330" y="150" width="90" height="34" rx="5" fill="#eb6834"/>
<text x="434" y="175" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">milissegundos</text>
<text x="60" y="227" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">2. Rede e processos</text>
<rect x="330" y="200" width="170" height="34" rx="5" fill="#eb6834"/>
<text x="514" y="225" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">segundos</text>
<text x="60" y="277" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">3. Memória (RAM)</text>
<rect x="330" y="250" width="300" height="34" rx="5" fill="#2a78d6"/>
<text x="644" y="275" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">até desligar</text>
<text x="60" y="327" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">4. Swap e temporários</text>
<rect x="330" y="300" width="420" height="34" rx="5" fill="#2a78d6"/>
<text x="764" y="325" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">até reiniciar</text>
<text x="60" y="377" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">5. Disco</text>
<rect x="330" y="350" width="600" height="34" rx="5" fill="#2a78d6"/>
<text x="944" y="375" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">dura mais</text>
<text x="60" y="427" font-size="21" font-weight="700" fill="#0b0b0b" text-anchor="start">6. Logs remotos</text>
<rect x="330" y="400" width="720" height="34" rx="5" fill="#2a78d6"/>
<text x="1064" y="425" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">dura mais</text>
<line x1="330" y1="468" x2="1080" y2="468" stroke="#52514e" stroke-width="3"/>
<text x="330" y="494" font-size="18" font-weight="700" fill="#eb6834" text-anchor="start">mais volátil</text>
<text x="1080" y="494" font-size="18" font-weight="700" fill="#2a78d6" text-anchor="end">menos volátil</text>
<text x="60" y="532" font-size="19" font-weight="400" fill="#0b0b0b" text-anchor="start">Cada cópia leva um hash (impressão digital) e uma cadeia de custódia: quem coletou, quando e como guardou.</text>
<text x="60" y="558" font-size="19" font-weight="400" fill="#0b0b0b" text-anchor="start">Quem coleta também altera a máquina, por isso o ideal é rodar as ferramentas de mídia externa.</text>
</g></svg>