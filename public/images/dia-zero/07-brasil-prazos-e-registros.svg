<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Prazos e registros no Brasil</title><desc id="d">Aviso à ANPD em 3 dias úteis, aviso aos titulares, guarda de registros de conexão por 1 ano e de acesso a aplicações por 6 meses.</desc><rect width="1200" height="600" fill="#fcfcfb"/><g font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif">
<text x="60" y="64" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="start">No Brasil: prazos e registros</text><text x="60" y="102" font-size="21" font-weight="400" fill="#52514e" text-anchor="start">Duas regras costumam pesar na investigação: o aviso do incidente e a guarda dos registros</text>
<rect x="60" y="140" width="530" height="172" rx="8" fill="#ffffff" stroke="#dcdbd6" stroke-width="2"/>
<text x="78" y="174" font-size="20" font-weight="700" fill="#52514e" text-anchor="start">Aviso à ANPD</text>
<text x="78" y="218" font-size="34" font-weight="700" fill="#eb6834" text-anchor="start">3 dias úteis</text>
<text x="78" y="248" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">Resolução CD/ANPD 15/2024: a contagem começa na ciência do</text>
<text x="78" y="268" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">incidente. Registre a hora em que a equipe soube.</text>
<rect x="610" y="140" width="530" height="172" rx="8" fill="#ffffff" stroke="#dcdbd6" stroke-width="2"/>
<text x="628" y="174" font-size="20" font-weight="700" fill="#52514e" text-anchor="start">Aviso aos titulares</text>
<text x="628" y="218" font-size="34" font-weight="700" fill="#eb6834" text-anchor="start">3 dias úteis</text>
<text x="628" y="248" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">Segundo análises jurídicas da resolução, o prazo também corre</text>
<text x="628" y="268" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">da ciência. Há prazos maiores para pequenos agentes.</text>
<rect x="60" y="330" width="530" height="172" rx="8" fill="#ffffff" stroke="#dcdbd6" stroke-width="2"/>
<text x="78" y="364" font-size="20" font-weight="700" fill="#52514e" text-anchor="start">Registros de conexão</text>
<text x="78" y="408" font-size="34" font-weight="700" fill="#eb6834" text-anchor="start">1 ano</text>
<text x="78" y="438" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">Marco Civil, art. 13: o administrador de sistema autônomo</text>
<text x="78" y="458" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">guarda os registros de conexão por 1 ano.</text>
<rect x="610" y="330" width="530" height="172" rx="8" fill="#ffffff" stroke="#dcdbd6" stroke-width="2"/>
<text x="628" y="364" font-size="20" font-weight="700" fill="#52514e" text-anchor="start">Acesso a aplicações</text>
<text x="628" y="408" font-size="34" font-weight="700" fill="#eb6834" text-anchor="start">6 meses</text>
<text x="628" y="438" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">Marco Civil, art. 15: provedores de aplicações guardam por 6</text>
<text x="628" y="458" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">meses. A polícia ou o MP pode pedir mais tempo, em caráter</text>
<text x="628" y="478" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">cautelar.</text>
<text x="60" y="564" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Resumo informativo, não é aconselhamento jurídico. Confira o texto oficial e consulte um advogado</text>
</g></svg>