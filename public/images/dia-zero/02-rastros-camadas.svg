<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="t d"><title id="t">Onde ficam os rastros de um ataque</title><desc id="d">Uma requisição atravessa seis camadas, e cada uma pode registrar o que viu. Os registros vão para um cofre central fora da máquina atacada.</desc><rect width="1200" height="580" fill="#fcfcfb"/><g font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif">
<text x="60" y="64" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="start">Onde ficam os rastros</text><text x="60" y="102" font-size="21" font-weight="400" fill="#52514e" text-anchor="start">Cada camada pode registrar o que viu, e os registros devem ir para um cofre fora da máquina atacada</text>
<rect x="60" y="150" width="160" height="92" rx="8" fill="#ffffff" stroke="#dcdbd6" stroke-width="2"/>
<text x="140.0" y="192" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="middle">Atacante</text>
<text x="140.0" y="220" font-size="16" font-weight="400" fill="#52514e" text-anchor="middle">origem aparente</text>
<line x1="223" y1="196" x2="241" y2="196" stroke="#52514e" stroke-width="3"/><polygon points="241,196 231,190 231,202" fill="#52514e"/>
<rect x="244" y="150" width="160" height="92" rx="8" fill="#ffffff" stroke="#dcdbd6" stroke-width="2"/>
<text x="324.0" y="192" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="middle">Internet</text>
<text x="324.0" y="220" font-size="16" font-weight="400" fill="#52514e" text-anchor="middle">provedores</text>
<line x1="407" y1="196" x2="425" y2="196" stroke="#52514e" stroke-width="3"/><polygon points="425,196 415,190 415,202" fill="#52514e"/>
<rect x="428" y="150" width="160" height="92" rx="8" fill="#ffffff" stroke="#dcdbd6" stroke-width="2"/>
<text x="508.0" y="192" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="middle">WAF ou proxy</text>
<text x="508.0" y="220" font-size="16" font-weight="400" fill="#52514e" text-anchor="middle">log de borda</text>
<line x1="591" y1="196" x2="609" y2="196" stroke="#52514e" stroke-width="3"/><polygon points="609,196 599,190 599,202" fill="#52514e"/>
<line x1="508.0" y1="242" x2="508.0" y2="330" stroke="#2a78d6" stroke-width="3" stroke-dasharray="6 6"/>
<polygon points="508.0,336 501.0,322 515.0,322" fill="#2a78d6"/>
<rect x="612" y="150" width="160" height="92" rx="8" fill="#ffffff" stroke="#dcdbd6" stroke-width="2"/>
