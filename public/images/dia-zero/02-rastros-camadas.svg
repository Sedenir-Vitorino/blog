<text x="692.0" y="220" font-size="16" font-weight="400" fill="#52514e" text-anchor="middle">log de acesso</text>
<line x1="775" y1="196" x2="793" y2="196" stroke="#52514e" stroke-width="3"/><polygon points="793,196 783,190 783,202" fill="#52514e"/>
<line x1="692.0" y1="242" x2="692.0" y2="330" stroke="#2a78d6" stroke-width="3" stroke-dasharray="6 6"/>
<polygon points="692.0,336 685.0,322 699.0,322" fill="#2a78d6"/>
<rect x="796" y="150" width="160" height="92" rx="8" fill="#ffffff" stroke="#dcdbd6" stroke-width="2"/>
<text x="876.0" y="192" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="middle">Aplicação</text>
<text x="876.0" y="220" font-size="16" font-weight="400" fill="#52514e" text-anchor="middle">log de eventos</text>
<line x1="959" y1="196" x2="977" y2="196" stroke="#52514e" stroke-width="3"/><polygon points="977,196 967,190 967,202" fill="#52514e"/>
<line x1="876.0" y1="242" x2="876.0" y2="330" stroke="#2a78d6" stroke-width="3" stroke-dasharray="6 6"/>
<polygon points="876.0,336 869.0,322 883.0,322" fill="#2a78d6"/>
<rect x="980" y="150" width="160" height="92" rx="8" fill="#ffffff" stroke="#dcdbd6" stroke-width="2"/>
<text x="1060.0" y="192" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="middle">Banco de dados</text>
<text x="1060.0" y="220" font-size="16" font-weight="400" fill="#52514e" text-anchor="middle">auditoria</text>
<line x1="1060.0" y1="242" x2="1060.0" y2="330" stroke="#2a78d6" stroke-width="3" stroke-dasharray="6 6"/>
<polygon points="1060.0,336 1053.0,322 1067.0,322" fill="#2a78d6"/>
<rect x="60" y="340" width="1080" height="110" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/>
<text x="600" y="386" font-size="24" font-weight="700" fill="#2a78d6" text-anchor="middle">Cofre de logs (SIEM ou armazenamento central)</text>
<text x="600" y="420" font-size="19" font-weight="400" fill="#0b0b0b" text-anchor="middle">Registros com data e hora, guardados fora da máquina atacada, para ninguém apagá-los depois</text>
<text x="60" y="490" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start">O endereço IP de origem é só o primeiro rastro e é fácil de disfarçar.</text>
<text x="60" y="520" font-size="20" font-weight="400" fill="#0b0b0b" text-anchor="start">A investigação cruza os registros de várias camadas para reconstruir o que aconteceu.</text>
<text x="60" y="560" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Conteúdo educativo, em nível geral</text>
</g></svg>